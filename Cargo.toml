[package]
name = "nothingx"
version = "0.3.0"
edition = "2021"
description = "NothingX for macOS: control panel for Nothing / CMF headphones"

[[bin]]
name = "nothingx"
path = "src/main.rs"

[dependencies]
slint = { version = "1.19", features = ["unstable-winit-030"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-io-bluetooth = "0.3"
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2-service-management = "0.3"

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# keep debug builds responsive (vector art rendering)
[profile.dev.package."*"]
opt-level = 2
